name: Propose EpicWolf import
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import selected upstream on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="integration/epicwolf-vendored"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch already exists. Review it; refusing overwrite."
            exit 1
          fi
          git switch -c "$BRANCH"
          bash scripts/vendor-epicwolf.sh
          node --version
          # Initialize a fresh shard with a real documented bootstrap defect.
          node .wolf/tools/wolf_bug.js append \
            --file .github/workflows/epicwolf-import.yml \
            --error "Fresh EpicWolf template had no initial JSONL bug shard" \
            --root-cause "Upstream template includes an empty buglog directory" \
            --fix "Create the first valid shard before the integrity check" \
            --tags epicwolf,bootstrap,ci
          node .wolf/tools/wolf_guard.js
          node --test .wolf/tools/wolf_bug.test.js .wolf/hooks/*.test.js
          git add .wolf .claude EPICWOLF-LICENSE EPICWOLF-UPSTREAM.txt
          git commit -m "chore: vendor pinned EpicWolf framework"
          git push origin "$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
            --title "Install pinned EpicWolf project memory" \
            --body "Imports ggurov/epicwolf at pinned revision with upstream license. Review agent hooks and workflow permissions before merging. Node guard and tests run in Actions. No KiCad circuit has been changed."; then
            echo "::warning::Import pushed and tests passed, but automatic PR creation was blocked by GitHub repository policy."
            echo "::notice::Open https://github.com/PJawZK/Relay-and-Fuse-box/compare/main...$BRANCH to create/review the PR manually."
          fi
